[auth]
site_url = "https://shadabur-rahaman.github.io/js-lab/"
additional_redirect_urls = ["https://shadabur-rahaman.github.io/js-lab/?resource-recovery=1", "http://127.0.0.1:5177/?resource-recovery=1"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# Hosted Auth uses this switch for the email provider. The global switch above
# blocks self-registration while existing authorized accounts can still sign in.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[functions.resource-api]
verify_jwt = false

[functions.resource-maintenance]
verify_jwt = false
